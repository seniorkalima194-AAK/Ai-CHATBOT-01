server {
    listen 80;
    server_name _;

    # Match the backend's 100 MB textbook-upload limit. Nginx otherwise
    # rejects PDFs over its default 1 MB request size before FastAPI sees them.
    client_max_body_size 100m;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React Router routes must return the app entry page when refreshed.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
